
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Ghanti - Digital Temple Bell</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #0099db;
        overflow-x: hidden;
        margin: 0;
      }
      .font-serif {
        font-family: 'Playfair Display', serif;
      }
      @keyframes swing {
        0% { transform: rotate(0deg); }
        20% { transform: rotate(15deg); }
        40% { transform: rotate(-15deg); }
        60% { transform: rotate(10deg); }
        80% { transform: rotate(-5deg); }
        100% { transform: rotate(0deg); }
      }
      .animate-swing {
        animation: swing 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        transform-origin: top center;
      }
      .bell-shadow {
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));
      }
    </style>
